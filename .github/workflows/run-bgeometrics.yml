name: Run BGeometrics Onchain upload logs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB writes). Use true to avoid DB changes.'
        required: false
        default: 'false'

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      BGEOMETRICS_TOKEN: ${{ secrets.BGEOMETRICS_TOKEN }}
      BGEOMETRICS_BASE_URL: https://api.bitcoin-data.com/v1
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch
        run: |
          python bgeometricscochain.py
        # If the script exits non-zero, the job fails and workflow stops
