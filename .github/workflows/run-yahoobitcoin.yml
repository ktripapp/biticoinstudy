name: Run yahoobitcoin and upload logs # 깃허브 액션 워크플로우 이름

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # 매시 실행 (원한다면 수정 가능) 추후 시간 조정을 해야 함.

jobs:
  run-and-upload:
    runs-on: ubuntu-latest # Ubuntu 최신 버전 가상 환경에서 실행
    steps:
      - name: Checkout repository # 깃허브 리포지토리 코드를 체크
        uses: actions/checkout@v4

      - name: Set up Python # Python 버전을 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies # requirements.txt에 명시된 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run yahoobitcoin.py and save output # yahoobitcoin.py를 실행하고 출력 로그를 저장
        env:
          # MONGO_URI는 GitHub Secrets에 설정된 값 체크
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          mkdir -p output
          # 표준 출력과 표준 에러를 로그 파일로 저장하면서 동시에 워크플로우 로그 화면에도 출력 명령어 사용)
          # Capture stdout/stderr to a log file and also print to the workflow log
          python yahoobitcoin.py 2>&1 | tee output/output.log

      # 실행 결과 로그 파일을 GitHub Actions의 아티팩트로 업로드
      - name: Upload logs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: yahoobitcoin-output # 아티팩트 이름
          path: output/output.log
