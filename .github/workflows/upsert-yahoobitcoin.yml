name: 09:10 Daily Yahoo Bitcoin Upsert (KST)

on:
  schedule:
    # 09:10 KST = 00:10 UTC
    - cron: '10 0 * * *'
  workflow_dispatch:

jobs:
  upsert-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run upsert script
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          mkdir -p output
          python yahoobitcoin_upsert.py 2>&1 | tee output/upsert.log

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: yahoobitcoin-upsert-log
          path: output/upsert.log
